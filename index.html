<!DOCTYPE html>
<html>
    <head>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
        <div id="app">
            <h1>
                {{message}}
            </h1>
            <h2>
                Luck Number: {{luckyNumber}}
            </h2>
        </div>
    </body>
    <script>
        const {createApp} = Vue;

        createApp({
            setup(){                
                const message = 'Hello From Vue 3!';
                const luckyNumber = 7;
                return {
                    message,
                    luckyNumber
                }
            }
        }).mount("#app");
    </script>
</html>
