<!DOCTYPE html>
<html>
    <head>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
        <div id="app">
            <h1>
                {{message}}
            </h1>
            <h2>
                Luck Number: {{luckyNumber}}
            </h2>
            <p>
                Lucky Numbers: {{luckyNumbers}}
            </p>
            <p>
                Employee Details: {{employee}}
            </p>
            <p>
                First Lucky Numbers: {{luckyNumbers[0]}}
            </p>
            <p>
                Employee with named {{employee.name}} is {{employee.age}} years old.
            </p>
        </div>
    </body>
    <script>
        const {createApp} = Vue;

        createApp({
            setup(){                
                const message = 'Hello From Vue 3!';
                const luckyNumber = 7;
                const luckyNumbers = [1,3,5,6,7,9,10];
                const employee = {
                    name: "John",
                    age: 30,
                    salary: 500000
                }
                return {
                    message,
                    luckyNumber,
                    luckyNumbers,
                    employee
                }
            }
        }).mount("#app");
    </script>
</html>
