<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
        <div id="app" class="container">
            <form @submit.prevent="handleSubmit">
                <div class="bg-info p-5 rounded m-5">
                    <div class="h2 text-center">
                        Learn Vue - Forms
                    </div>
                    <hr />
                    <div class="input-group mb-3">
                        <span class="input-group-text">Name</span>
                        <input type="text" class="form-control" v-model.trim="formObject.name" />
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">Email</span>
                        <input type="text" class="form-control" v-model.trim="formObject.email" />
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">Phone #</span>
                        <input type="text" class="form-control" v-model.number="formObject.phoneNumber" />
                    </div>
                    <div class="border p-1">
                        <label class="form-label p-3">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="radioButton" 
                                    v-model="formObject.gender" value="Male">
                                Male
                            </input>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="radioButton" 
                                    v-model="formObject.gender" value="Female">
                                Female
                            </input>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="checkbox" class="form-check-input" v-model="formObject.subscribe" />
                        <span class="form-check-label">&nbsp; Subscribe to Newsletter</span>
                    </div>
                    <div class="text-center pb-3">
                        <button class="btn btn-secondary m-2 w-25">Submit</button>
                    </div>
                </div>
            </form>
        </div>
    </body>
    <script>
        const { createApp, reactive } = Vue;

        createApp({
            setup(){

                const formObject = reactive({
                    name: '',
                    gender: '',
                    email: '',
                    phoneNumber: '',
                    subscribe: false,
                });

                function handleSubmit(){
                    console.log(formObject);
                }

                return{
                    formObject,
                    handleSubmit
                }
            }
        }).mount("#app");
    </script>
</html>
