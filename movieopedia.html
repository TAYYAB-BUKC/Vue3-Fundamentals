<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
        <div id="app" class="container">
            <div class="bg-info p-5 rounded m-5">
                <div class="h2 text-center">Learn Vue - MovieOPedia</div>
                <hr />
                <div class="input-group mb-3">
                <span class="input-group-text">Title</span>
                <input type="text" class="form-control" v-model="newMovie.title" />
                </div>
                <div class="input-group mb-3">
                <span class="input-group-text">Year</span>
                <input type="text" class="form-control" v-model="newMovie.year" />
                </div>
                <div class="text-center pb-3">
                <button class="btn btn-secondary m-2 w-25" v-on:click="AddMovie">Add Movie</button>
                <button class="btn btn-danger m-2 w-25" v-on:click="RemoveMovie">Remove Movie</button>
                </div>
                <div class="border p-3 w-100 mx-auto">
                <div class="text-center">
                    <h2 class="text-center">Movie List</h2>
                    <h3 class="text-danger" v-if="showMessage">
                        You can only add 10 movies.
                    </h3>
                    <hr />
                </div>
                <ul class="list-group">
                    <li v-for="movie in GetAllMovies" class="list-group-item">
                        {{ movie }}
                    </li>
                </ul>
                </div>
            </div>
        </div>
    </body>
    <script>
        const {createApp, ref, onMounted, reactive, computed, watch} = Vue;

        createApp({
            setup(){                
                let maxMovieCount = ref(7);
                let showMessage = ref(false);
                let movies= reactive([
                    { id: 1, title: "Movie 1", year: 2020 },
                    { id: 2, title: "Movie 2", year: 2021 },
                    { id: 3, title: "Movie 3", year: 2022 },
                    { id: 4, title: "Movie 4", year: 2022 },
                    { id: 5, title: "Movie 5", year: 2023 },
                    { id: 6, title: "Movie 6", year: 2024 },
                    { id: 7, title: "Movie 7", year: 2025 },
                ]);

                let newMovie = reactive({
                    id: 0, title: '', year: ''
                });

                function AddMovie(){
                    var newID = movies == null || movies == undefined ? 1 : movies.at(-1).id + 1;
                    // let movie = {
                    //     id: newID, title: newMovie.title, year: newMovie.year
                    // }
                    newMovie.id = newID;
                    maxMovieCount.value++;
                    if(maxMovieCount.value < 11){
                        movies.push({...newMovie});
                        newMovie.id = 0;
                        newMovie.title = '';
                        newMovie.year = '';
                    }
                }

                function RemoveMovie(){
                    movies.pop();
                }

                watch(()=> maxMovieCount.value, (newValue, OldValue)=>{
                    console.log(`maxMovieCount Counter value changed from ${OldValue} to ${newValue}`);
                    if(newValue > 10){
                        alert(`Max Movie collection limit reached that is 10.`);
                    }
                });

                // function GetAllMovies(){
                //     return movies.map((movie)=>{
                //         return `${movie.title} was release in ${movie.year}.`;
                //     });
                // }

                const GetAllMovies = computed(() =>{
                    return movies.map((movie)=>{
                        return `${movie.title} was release in ${movie.year}.`;
                    });
                });

                watch(()=> movies.length, (newValue, OldValue)=>{
                    if(newValue > 7){
                        showMessage.value = true;
                    }
                });

                return {
                    movies,
                    newMovie,
                    AddMovie,
                    RemoveMovie,
                    GetAllMovies,
                    showMessage
                }
            }
        }).mount("#app");
    </script>
</html>
